name: islami
description: Islami - an Islamic companion app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.2.3
  http: ^1.2.0
  just_audio: ^0.9.36
  adhan: ^2.0.0
  hijri: ^3.0.0
  intl: ^0.19.0
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/suras/
    - assets/hadeeth/
    - assets/data/

  fonts:
    - family: Kamali
      fonts:
        - asset: assets/fonts/Kamali-Regular.ttf
    - family: JannaLT
      fonts:
        - asset: assets/fonts/JannaLT-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
